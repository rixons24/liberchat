databases:
  - name: liberchat-db
    databaseName: liberchat
    user: liberchat
    plan: free

services:
  - type: redis
    name: liberchat-redis
    plan: free
    ipAllowList: []

  - type: web
    name: liberchat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: liberchat-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: liberchat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: liberchat-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_REF_SALT
        generateValue: true
      - key: MEDIA_SESSION_TIMEOUT_MINUTES
        value: "5"
      - key: POST_DEFAULT_EXPIRY_HOURS
        value: "72"
      # Set these manually in the Render dashboard after first deploy —
      # they're real third-party credentials, not something to generate:
      #   MEDIA_BUCKET, MEDIA_STORAGE_ENDPOINT, MEDIA_STORAGE_ACCESS_KEY,
      #   MEDIA_STORAGE_SECRET_KEY  (Cloudflare R2)
      #   SAFER_API_KEY             (Thorn Safer, CSAM scanning)
      #   NCMEC_REPORT_ENDPOINT     (after registering as a reporter)
      #   SMS_PROVIDER_API_KEY      (Twilio / Africa's Talking)
      # Until these are set, signup/login/posts/reports/moderation all
      # work normally; media upload will fail (no real object storage
      # configured yet), and OTPs generate but are never actually texted.
      #
      # TEMPORARY, FOR TESTING ONLY: set DEBUG_OTP_ENDPOINT_ENABLED=true to
      # enable GET /auth/debug/otp/{phone_number} so you can test signup
      # before Twilio is wired up. Set it back to false (or delete it) the
      # moment SMS_PROVIDER_API_KEY is live — this endpoint bypasses
      # phone verification entirely and must never be on in production.
