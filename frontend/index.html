<body>
<div id="root" class="app"></div>

<script>
// ---------- Mock state ----------
const state = {
  screen: "gate",          // gate | feed | thread | mod | adminLogin
  gateChecked: false,
  activeThreadId: null,
  toast: null,
  viewerMedia: null,       // { id, type, viewCount, consumed }
  reportModalOpen: false,
  composeModalOpen: false,
  modTab: "queue",         // queue | audit
  modSelectedReportId: null,
  attachModalOpen: false,
  adminAuthenticated: false,
  adminLoginError: null,
  authToken: null,
  pendingSignup: null,     // holds form data between signup/start and OTP verify
  authError: null,
  feedLoading: false,
  activeThread: null,
  viewerSignedUrl: null,
};

// Mock only — the real backend never exposes admin creds this way. See
// app/routers/admin_auth.py: this is a genuinely separate credential
// system (separate admin_users table, separate JWT token type) with no
// public self-registration endpoint. This mock just simulates the same
// shape for the prototype.
const MOCK_ADMIN_CREDENTIALS = { username: "libermod01", password: "adminpassword12345" };

// ---------- Real backend wiring ----------
// Point this at your deployed API. Auth/posts now hit the real FastAPI
// backend built earlier in this project — DM/media still run on local
// mock state pending websocket + upload wiring (noted inline below).
const urlParams = new URLSearchParams(window.location.search);
const API_BASE = urlParams.get("api")
  || localStorage.getItem("liberchat_api_base")
  || "http://localhost:8000";
if (urlParams.get("api")) localStorage.setItem("liberchat_api_base", urlParams.get("api"));

async function api(path, { method = "GET", body, token, isFormData = false } = {}) {
  const headers = {};
  if (!isFormData) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const resp = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? (isFormData ? body : JSON.stringify(body)) : undefined,
  });

  let data = null;
  try { data = await resp.json(); } catch (_) { /* no body */ }

  if (!resp.ok) {
    if (resp.status === 401 && token) {
      clearSession();
      showToast("Your session expired — please log in again.");
    }
    const detail = data && data.detail ? (Array.isArray(data.detail) ? data.detail[0].msg : data.detail) : `Request failed (${resp.status})`;
    throw new Error(detail);
  }
  return data;
}

const posts = [
  { code: "0142", body: "Looking for someone to grab coffee and talk film photography. No pressure, just conversation.", location: "STONE TOWN", tags: ["FRIENDS","CASUAL"] },
  { code: "0143", body: "New in town, want to meet people who are into diving and boat trips on weekends.", location: "NUNGWI", tags: ["ACTIVITY"] },
  { code: "0144", body: "Sharing details of what I'm looking for tonight — tagged NSFW since the content is explicit.", location: "STONE TOWN", tags: ["CASUAL","NSFW"] },
];



const TIER1 = new Set(["underage", "threat", "nonconsensual"]);
const TIER2 = new Set(["solicit", "harass", "unsolicited"]);

function severityOf(reason) {
  if (TIER1.has(reason)) return 1;
  if (TIER2.has(reason)) return 2;
  return 3;
}

let reportSeq = 4;
const reports = [
  {
    id: "R-0001", reason: "underage", detail: "Profile bio mentions being 16.",
    reportedHandle: "QuietFalcon42", reportedPostCode: "0091", createdAt: "2026-07-22 09:14",
    status: "open", priorReportsAgainst: 0, priorReportsByReporter: 1,
  },
  {
    id: "R-0002", reason: "harass", detail: "Kept messaging after I said I wasn't interested.",
    reportedHandle: "IronOtter88", reportedPostCode: "0077", createdAt: "2026-07-22 11:30",
    status: "open", priorReportsAgainst: 1, priorReportsByReporter: 3,
  },
  {
    id: "R-0003", reason: "scam", detail: "Asked me to pay a deposit off-platform before meeting.",
    reportedHandle: "SilverEcho19", reportedPostCode: "0064", createdAt: "2026-07-21 20:05",
    status: "open", priorReportsAgainst: 2, priorReportsByReporter: 1,
  },
];
const auditLog = [];

// ---------- Helpers ----------
function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  if (state.screen === "gate") root.appendChild(GateScreen());
  if (state.screen === "signup") root.appendChild(SignupScreen());
  if (state.screen === "otp") root.appendChild(OtpScreen());
  if (state.screen === "login") root.appendChild(LoginScreen());
  if (state.screen === "feed") root.appendChild(FeedScreen());
  if (state.screen === "thread") root.appendChild(ThreadScreen());
  if (state.screen === "mod") root.appendChild(state.adminAuthenticated ? ModScreen() : AdminLoginScreen());
  if (state.screen === "adminLogin") root.appendChild(AdminLoginScreen());
  if (state.viewerMedia) root.appendChild(MediaViewer());
  if (state.reportModalOpen) root.appendChild(ReportModal());
  if (state.composeModalOpen) root.appendChild(ComposeModal());
  if (state.attachModalOpen) root.appendChild(AttachMediaModal());
  if (state.toast) root.appendChild(Toast());
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

function showToast(text) {
  state.toast = text;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}

// ---------- Screens ----------
function GateScreen() {
  const points = [
    "You must be 18 or older.",
    "Identities are not verified. Treat every stranger as unverified.",
    "Meeting in person is your decision and your risk. Meet public, tell a friend.",
    "Report anything uncomfortable in two taps. Safety reports are reviewed first.",
    "Zero tolerance for harm to minors. Reported to law enforcement, no exceptions.",
    "Phone verification is required at signup — this is what lets us block repeat abuse and keep the platform accountable.",
  ];

  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:6px;" });
  panel.appendChild(el("span", { class: "label" }, "Read before continuing"));

  points.forEach((text, i) => {
    const row = el("div", { class: "interstitial-point" }, [
      el("span", { class: "point-code" }, String(i + 1).padStart(2, "0")),
      el("span", { class: "point-text" }, text),
    ]);
    panel.appendChild(row);
  });

  const checkboxRow = el("label", { class: "checkbox-row", style: "cursor:pointer;" });
  const checkbox = el("input", { type: "checkbox" });
  checkbox.addEventListener("change", (e) => { state.gateChecked = e.target.checked; render(); });
  checkboxRow.appendChild(checkbox);
  checkboxRow.appendChild(el("span", {}, "I confirm I am 18 or older and agree to the Community Guidelines."));
  panel.appendChild(checkboxRow);

  const btn = el("button", { class: "btn-primary", style: "margin-top:16px;" }, "Continue");
  if (!state.gateChecked) btn.setAttribute("disabled", "true");
  btn.addEventListener("click", () => { if (state.gateChecked) { state.screen = "signup"; render(); } });
  panel.appendChild(btn);

  const loginLink = el("button", { class: "btn-ghost", style: "margin-top:8px;" }, "Already have an account? Log in");
  loginLink.addEventListener("click", () => { state.screen = "login"; render(); });
  panel.appendChild(loginLink);

  wrap.appendChild(panel);
  return wrap;
}

function saveSession(token) {
  state.authToken = token;
  localStorage.setItem("liberchat_auth_token", token);
}

function clearSession() {
  state.authToken = null;
  localStorage.removeItem("liberchat_auth_token");
  state.screen = "gate";
  render();
}
function field(type, placeholder, extra = {}) {
  const input = el("input", { type, placeholder, ...extra });
  input.style.cssText = "font-family:'Inter'; font-size:16px; padding:12px; min-height:44px; border:1px solid #C9C7BC; background:#fff; width:100%;";
  return input;
}

function SignupScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Create account"));

  const phone = field("tel", "Phone number, e.g. +255700000000");
  const handle = field("text", "Handle — how others see you");
  const dob = field("date", "Date of birth");
  const password = field("password", "Password (12+ characters)");
  [phone, handle, dob, password].forEach((f) => panel.appendChild(f));

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Send verification code");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    submit.textContent = "Sending...";
    submit.disabled = true;
    try {
      await api("/auth/signup/start", {
        method: "POST",
        body: {
          phone_number: phone.value.trim(),
          dob: dob.value,
          age_gate_accepted: true,
          handle: handle.value.trim(),
          password: password.value,
        },
      });
      state.pendingSignup = { phoneNumber: phone.value.trim() };
      state.screen = "otp";
      render();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
      submit.textContent = "Send verification code";
      submit.disabled = false;
    }
  });
  panel.appendChild(submit);

  wrap.appendChild(panel);
  return wrap;
}

function OtpScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Enter verification code"));
  panel.appendChild(el("p", { style: "font-size:13px; color:#8C8A82;" },
    `A code was sent to ${state.pendingSignup.phoneNumber}.`));

  const code = field("text", "6-digit code");
  panel.appendChild(code);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Verify");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    try {
      const resp = await api("/auth/signup/verify", {
        method: "POST",
        body: { phone_number: state.pendingSignup.phoneNumber, otp_code: code.value.trim() },
      });
      saveSession(resp.access_token);
      state.pendingSignup = null;
      state.screen = "feed";
      render();
      loadFeed();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
    }
  });
  panel.appendChild(submit);

  wrap.appendChild(panel);
  return wrap;
}

function LoginScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Log in"));

  const phone = field("tel", "Phone number");
  const password = field("password", "Password");
  panel.appendChild(phone);
  panel.appendChild(password);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Log in");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    try {
      const resp = await api("/auth/login", {
        method: "POST",
        body: { phone_number: phone.value.trim(), password: password.value },
      });
      saveSession(resp.access_token);
      state.screen = "feed";
      render();
      loadFeed();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
    }
  });
  panel.appendChild(submit);

  wrap.appendChild(panel);
  return wrap;
}

async function loadFeed() {
  state.feedLoading = true;
  render();
  try {
    const data = await api("/posts/feed", { token: state.authToken });
    posts.length = 0; // clear mock seed data, replace with real posts
    data.forEach((p) => {
      posts.push({
        id: p.id,
        code: p.id.slice(0, 8).toUpperCase(),
        body: p.body_text,
        location: p.location_label || "NO LOCATION SET",
        tags: p.intent_tags && p.intent_tags.length ? p.intent_tags : ["OTHER"],
      });
    });
  } catch (e) {
    showToast("Could not load feed: " + e.message);
  } finally {
    state.feedLoading = false;
    render();
  }
}

function decodeJwtSub(token) {
  try {
    const payload = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return payload.sub;
  } catch (_) { return null; }
}

let activeSocket = null;

async function openThread(postId) {
  try {
    const thread = await api("/dm/thread/start", { method: "POST", token: state.authToken, body: { post_id: postId } });
    const history = await api(`/dm/thread/${thread.id}/messages`, { token: state.authToken });

    state.activeThread = {
      id: thread.id,
      otherUserId: thread.user_a_id === decodeJwtSub(state.authToken) ? thread.user_b_id : thread.user_a_id,
      reported: false,
      messages: history.map((m) => ({
        id: m.id,
        from: m.sender_id === decodeJwtSub(state.authToken) ? "me" : "them",
        text: m.ciphertext,
        time: new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        media: m.media_id ? {
          id: m.media_id,
          type: m.media_info?.type || "image",
          nsfw: m.media_info?.nsfw || false,
          nsfwAcknowledged: !(m.media_info?.nsfw),
          consumed: m.media_info?.consumed || false,
          viewCount: 0,
        } : null,
      })),
    };

    if (activeSocket) activeSocket.close();
    activeSocket = new WebSocket(`${API_BASE.replace("http", "ws")}/dm/ws/${thread.id}?token=${state.authToken}`);
    activeSocket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      state.activeThread.messages.push({
        id: data.message_id,
        from: data.sender_id === decodeJwtSub(state.authToken) ? "me" : "them",
        text: data.ciphertext,
        time: new Date(data.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        media: data.media_id ? {
          id: data.media_id,
          type: data.media_info?.type || "image",
          nsfw: data.media_info?.nsfw || false,
          nsfwAcknowledged: !(data.media_info?.nsfw),
          consumed: false,
          viewCount: 0,
        } : null,
      });
      render();
    };

    state.screen = "thread";
    render();
  } catch (e) {
    showToast("Could not open thread: " + e.message);
  }
}

function FeedScreen() {
  const wrap = el("div", { style: "display:flex; flex-direction:column; flex:1; min-height:0;" });
  wrap.appendChild(Header("Liberchat", null));

  const main = el("main", { class: "feed-main" });
  posts.forEach((p) => {
    const card = el("div", { class: "post panel", style: "cursor:pointer;" });
    card.addEventListener("click", () => openThread(p.id));

    card.appendChild(el("div", { class: "post-top" }, [
      el("span", { class: "label" }, `POST / ${p.code}`),
      el("span", { class: "label" }, p.location),
    ]));

    card.appendChild(el("p", { class: "post-body" }, p.body));

    const bottom = el("div", { class: "post-bottom" });

function ThreadScreen() {
  const thread = state.activeThread;
  const wrap = el("div", { style: "display:flex; flex-direction:column; flex:1; min-height:0;" });
  wrap.appendChild(Header(`THREAD / ${thread.id.slice(0, 8).toUpperCase()}`, () => { state.screen = "feed"; render(); }));

  const msgsWrap = el("div", { class: "thread-msgs" });

  if (thread.reported) {
    msgsWrap.appendChild(el("div", { class: "empty" }, "This thread has been reported. It's frozen for review — the other person can't send new messages."));
  }

  if (thread.messages.length === 0) {
    msgsWrap.appendChild(el("div", { class: "empty" }, "No messages yet. Say hello."));
  }

  thread.messages.forEach((m) => {
    const bubble = el("div", { class: `msg ${m.from}` });
    if (m.text) bubble.appendChild(document.createTextNode(m.text));
    if (m.media) {
      let chip;
      if (m.media.consumed) {
        chip = el("div", { class: "media-chip consumed" },
          `${m.media.type.toUpperCase()} — VIEWED ${m.media.viewCount || 1}× — DELETED`);
      } else if (m.media.nsfw && !m.media.nsfwAcknowledged) {
        chip = el("div", {
          class: "media-chip",
          style: "border-color:#B23B2E; color:#B23B2E; background:repeating-linear-gradient(45deg,#F7F6F2,#F7F6F2 6px,#EDECE7 6px,#EDECE7 12px);",
        }, `⚠ NSFW ${m.media.type.toUpperCase()} — TAP TO REVEAL`);
        chip.addEventListener("click", () => { m.media.nsfwAcknowledged = true; render(); });
      } else {
        chip = el("div", { class: "media-chip" }, `TAP TO VIEW ${m.media.type.toUpperCase()} — VIEW ONCE`);
        chip.addEventListener("click", async () => {
          try {
            const resp = await api(`/media/${m.media.id}/view`, { method: "POST", token: state.authToken });
            m.media.viewCount = resp.view_count;
            state.viewerMedia = m.media;
            state.viewerSignedUrl = resp.signed_url;
            render();
          } catch (e) {
            showToast("Could not open media: " + e.message);
          }
        });
      }
      bubble.appendChild(document.createElement("br"));
      bubble.appendChild(chip);
    }
    bubble.appendChild(el("span", { class: "msg-meta" }, m.time));
    msgsWrap.appendChild(bubble);
  });

  wrap.appendChild(msgsWrap);

  const composer = el("div", { class: "composer" });
  const input = el("input", { type: "text", placeholder: thread.reported ? "This thread is frozen." : "Message — plaintext for now, E2EE key exchange not yet wired client-side" });
  if (thread.reported) input.setAttribute("disabled", "true");
  const mediaBtn = el("button", { class: "icon-btn" }, "＋");
  mediaBtn.addEventListener("click", () => {
    if (thread.reported) return;
    state.attachModalOpen = true;
    render();
  });
  const sendBtn = el("button", { class: "btn-secondary" }, "Send");
  sendBtn.addEventListener("click", () => {
    if (thread.reported) return;
    if (!input.value.trim()) return;
    if (!activeSocket || activeSocket.readyState !== WebSocket.OPEN) {
      showToast("Connection lost — reopen the thread.");
      return;
    }
    activeSocket.send(JSON.stringify({ ciphertext: input.value.trim(), media_id: null }));
    // Optimistic local echo — the real row comes back for the recipient
    // via their own socket message; our own copy is added here since the
    // relay only pushes to the *other* participant, not an echo to sender.
    thread.messages.push({ from: "me", text: input.value.trim(), time: nowTime() });
    input.value = "";
    render();
  });
  composer.appendChild(mediaBtn);
  composer.appendChild(input);
  composer.appendChild(sendBtn);
  wrap.appendChild(composer);

  return wrap;
}

  const s = severityOf(reason);
  if (s === 1) return { text: "TIER 1", color: "#B23B2E" };
  if (s === 2) return { text: "TIER 2", color: "#C97A00" };
  return { text: "TIER 3", color: "#8C8A82" };
}

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
}

function MediaViewer() {
  const media = state.viewerMedia;
  const wrap = el("div", { class: "viewer" });
  wrap.appendChild(el("div", { class: "viewer-top" }, [
    el("span", { class: "label", style: "color:#888;" }, `${media.type.toUpperCase()} / VIEWED ${media.viewCount}×`),
    (() => {
      const b = el("button", { class: "btn-danger" }, "Close — deletes on exit");
      b.addEventListener("click", async () => {
        try {
          await api(`/media/${media.id}/end-session`, { method: "POST", token: state.authToken });
        } catch (e) {
          showToast("Warning: could not confirm deletion — " + e.message);
        }
        const msg = state.activeThread.messages.find((m) => m.media && m.media.id === media.id);
        if (msg) { msg.media.consumed = true; msg.media.viewCount = media.viewCount; }
        state.viewerMedia = null;
        state.viewerSignedUrl = null;
        render();
        showToast("Media deleted from server");
      });
      return b;
    })(),
  ]));

  const replay = el("button", { class: "btn-secondary", style: "margin:0 auto;" }, "Replay (within this session)");
  replay.addEventListener("click", async () => {
    try {
      const resp = await api(`/media/${media.id}/view`, { method: "POST", token: state.authToken });
      media.viewCount = resp.view_count;
      render();
    } catch (e) {
      showToast("Could not replay: " + e.message);
    }
  });

  const body = el("div", { class: "viewer-body" });
  if (media.type === "image") {
    body.appendChild(el("img", { src: state.viewerSignedUrl, style: "max-height:70vh; max-width:100%;" }));
  } else if (media.type === "video") {
    const v = document.createElement("video");
    v.src = state.viewerSignedUrl; v.controls = true; v.autoplay = true;
    v.style.cssText = "max-height:70vh; max-width:100%;";

  } else {
    const a = document.createElement("audio");
    a.src = state.viewerSignedUrl; a.controls = true; a.autoplay = true;
    body.appendChild(a);
  }
  body.appendChild(el("div", { style: "margin-top:20px; text-align:center;" }, replay));
  wrap.appendChild(body);

  wrap.appendChild(el("div", { class: "viewer-bottom" }, el("span", { class: "label", style: "color:#666;" }, "This content deletes permanently when you leave this screen.")));
  return wrap;
}

        selectedTags.delete(tag);
        chip.style.background = "transparent";
        chip.style.color = tag === "NSFW" ? "#B23B2E" : "#8C8A82";
      } else {
        selectedTags.add(tag);
        chip.style.background = tag === "NSFW" ? "#B23B2E" : "#141414";
        chip.style.color = "#F7F6F2";
      }
    });
    tagRow.appendChild(chip);
  });
  modal.appendChild(tagRow);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "Post text is required.");
  modal.appendChild(errorMsg);

  const submitBtn = el("button", { class: "btn-primary" }, "Post");
  submitBtn.addEventListener("click", async () => {
    if (!textarea.value.trim()) {
      errorMsg.style.display = "block";
      return;
    }
    const tags = selectedTags.size ? Array.from(selectedTags) : ["OTHER"];
    submitBtn.textContent = "Posting...";
    submitBtn.disabled = true;
    try {
      await api("/posts/", {
        method: "POST",
        token: state.authToken,
        body: {
          body_text: textarea.value.trim(),
          intent_tags: tags,
          location_label: locationInput.value.trim().toUpperCase() || null,
        },
      });
      state.composeModalOpen = false;
      render();
      showToast("Post published");
      loadFeed();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
      submitBtn.textContent = "Post";
      submitBtn.disabled = false;
    }
  });
  modal.appendChild(submitBtn);

  const cancel = el("button", { class: "btn-ghost" }, "Cancel");
  cancel.addEventListener("click", () => { state.composeModalOpen = false; render(); });
  modal.appendChild(cancel);

  backdrop.appendChild(modal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.composeModalOpen = false; render(); } });
  return backdrop;
}

function Toast() {
  return el("div", { class: "toast" }, state.toast);
}

// Admin console is reachable ONLY via a direct URL (e.g. yourapp.com/#admin),
// never via any link, button, or nav item inside the regular app. A normal
// user browsing LiberChat has no path that leads here.
if (window.location.hash === "#admin") {
  state.screen = "adminLogin";
} else {
  const savedToken = localStorage.getItem("liberchat_auth_token");
  if (savedToken) {
    state.authToken = savedToken;
    state.screen = "feed";
    // Fire-and-forget: if the token's expired/invalid, loadFeed's own
    // error handling will show a toast. A 401 here doesn't auto-log-out
    // since a transient network hiccup shouldn't silently sign someone
    // out — they can still navigate normally and retry.
    loadFeed();
  }
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // Fails silently if served from file:// or a host that blocks SW —
      // app still works as a normal page, just not installable.
    });
  });
}
</script>
</body>
</html>
