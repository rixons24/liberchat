<style>
  :root {
    --bg: #EDECE7;
    --surface: #F7F6F2;
    --input-bg: #FFFFFF;
    --ink: #141414;
    --muted: #8C8A82;
    --line: #C9C7BC;
    --accent: #FF4B1F;
    --danger: #B23B2E;
    --msg-me-bg: #141414;
    --msg-me-text: #F7F6F2;
  }
  body.dark {
    --bg: #1A1917;
    --surface: #242321;
    --input-bg: #2C2B28;
    --ink: #EDECE7;
    --muted: #97958C;
    --line: #3A3934;
    --accent: #FF5C33;
    --danger: #E8846A;
    --msg-me-bg: #EDECE7;
    --msg-me-text: #141414;
  }

  * { box-sizing: border-box; border-radius: 0 !important; box-shadow: none !important; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { height: 100%; overscroll-behavior-y: contain; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
  .app { max-width: 420px; width: 100%; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
         padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  /* Tablet: app becomes a bordered panel floating in the viewport, feed
     reflows into a 2-column grid. Below this width (phones) the app stays
     edge-to-edge full-bleed, matching native mobile app conventions. */
  @media (min-width: 640px) {
    .app { max-width: 640px; height: 92vh; height: 92dvh; margin: 4vh auto; border: 1px solid var(--line); }
    main.feed-main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
    main.feed-main .post { margin-bottom: 0; }
    .msg { max-width: min(78%, 420px); }
  }

  /* Desktop: wider panel, 3-column feed, mod console queue gets breathing room. */
  @media (min-width: 1024px) {
    .app { max-width: 960px; }
    main.feed-main { grid-template-columns: repeat(3, 1fr); }
  }
  .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); }
  .wordmark { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; cursor:pointer; }
  button { font-family: 'IBM Plex Mono', monospace; cursor: pointer; background: none; }
  /* Uniform box padding scale: 12px vertical / 16px horizontal for all
     standard buttons and inputs, 44px minimum touch target height.
     Only the compact chip/tag elements use a smaller scale. */
  .btn-secondary { color: var(--ink); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 16px; min-height:44px; border: 1px solid var(--ink); }
  .btn-primary { background: var(--accent); color: var(--surface); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 16px; min-height:44px; border: 1px solid var(--accent); width: 100%; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-danger { color: var(--danger); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 16px; min-height:44px; border: 1px solid var(--danger); }
  .btn-ghost { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 16px; min-height:44px; border: 1px solid var(--line); }
  main { flex: 1; min-height: 0; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .post { display: flex; flex-direction: column; gap: 12px; padding: 16px; margin-bottom: 12px; }
  .post-top { display: flex; justify-content: space-between; }
  .post-body { font-size: 15px; line-height: 1.55; }
  .post-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
  .tags { display: flex; gap: 6px; }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); padding: 4px 8px; color: var(--muted); }
  .interstitial-point { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
  .point-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); padding-top: 2px; }
  .point-text { font-size: 14px; line-height: 1.5; }
  .checkbox-row { display: flex; gap: 10px; align-items: flex-start; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 6px; }
  .checkbox-row span { font-size: 12px; color: var(--muted); }
  .thread-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  .thread-msgs { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width: 78%; padding: 10px 12px; font-size:14px; line-height:1.45; }
  .msg.me { align-self:flex-end; background:var(--msg-me-bg); color:var(--msg-me-text); }
  .msg.them { align-self:flex-start; background:var(--surface); border:1px solid var(--line); }
  .msg-meta { font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.05em; opacity:0.5; margin-top:4px; display:block; }
  .media-chip { display:flex; align-items:center; gap:8px; padding:12px; min-height:44px; border:1px dashed var(--muted); cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; }
  .media-chip.consumed { border-style:solid; color:var(--muted); cursor:default; }
  .composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); align-items:center;
              padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .composer input[type=text] { flex:1; font-family:'Inter'; font-size:16px; padding:12px 16px; min-height:44px; border:1px solid var(--line); background:var(--surface); }
  .icon-btn { border:1px solid var(--line); padding:10px 12px; font-size:16px; min-width:44px; min-height:44px; }
  .viewer { position:fixed; inset:0; background:var(--ink); color:var(--surface); display:flex; flex-direction:column; z-index:50; }
  .viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #333; }
  .viewer-body { flex:1; display:flex; align-items:center; justify-content:center; padding: 30px; text-align:center; }
  .viewer-bottom { padding: 12px 16px; border-top: 1px solid #333; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(20,20,20,0.55); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .modal { background:var(--surface); border:1px solid var(--line); width:100%; padding:20px 16px; display:flex; flex-direction:column; gap:10px; max-width:420px; max-height:80vh; overflow-y:auto; }
  .reason-btn { text-align:left; padding:12px 16px; min-height:44px; border:1px solid var(--line); font-family:'Inter'; font-size:14px; background:var(--input-bg); }
  .reason-btn.tier1 { border-color:var(--danger); }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; padding:12px 18px; z-index:70; }
  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
// ---------- Mock state ----------
const state = {
  screen: "landing",       // landing | gate | signup | otp | login | feed | thread | mod | adminLogin
  gateChecked: false,
  activeThreadId: null,
  toast: null,
  viewerMedia: null,       // { id, type, viewCount, consumed }
  reportModalOpen: false,
  composeModalOpen: false,
  modTab: "queue",         // queue | audit
  modSelectedReportId: null,
  attachModalOpen: false,
  adminAuthenticated: false,
  adminLoginError: null,
  authToken: null,
  pendingSignup: null,     // holds form data between signup/start and OTP verify
  authError: null,
  feedLoading: false,
  activeThread: null,
  viewerSignedUrl: null,
  screenBeforeThread: "feed", // where to return to when leaving a thread (feed or messages)
  threads: [],             // inbox list from GET /dm/threads
  threadsLoading: false,
  unreadCount: 0,
  darkMode: localStorage.getItem("liberchat_dark_mode") === "true",
  profileMenuOpen: false,
  audioRecording: false,
  audioRecorder: null,
  audioChunks: [],
  recordedAudioBlob: null,
};

// Mock only — the real backend never exposes admin creds this way. See
// app/routers/admin_auth.py: this is a genuinely separate credential
// system (separate admin_users table, separate JWT token type) with no
// public self-registration endpoint. This mock just simulates the same
// shape for the prototype.
const MOCK_ADMIN_CREDENTIALS = { username: "libermod01", password: "adminpassword12345" };

// ---------- Real backend wiring ----------
// Point this at your deployed API. Auth/posts now hit the real FastAPI
// backend built earlier in this project — DM/media still run on local
// mock state pending websocket + upload wiring (noted inline below).
const urlParams = new URLSearchParams(window.location.search);
const API_BASE = urlParams.get("api")
  || localStorage.getItem("liberchat_api_base")
  || "http://localhost:8000";
if (urlParams.get("api")) localStorage.setItem("liberchat_api_base", urlParams.get("api"));

async function api(path, { method = "GET", body, token, isFormData = false } = {}) {
  const headers = {};
  if (!isFormData) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const resp = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? (isFormData ? body : JSON.stringify(body)) : undefined,
  });

  let data = null;
  try { data = await resp.json(); } catch (_) { /* no body */ }

  if (!resp.ok) {
    if (resp.status === 401 && token) {
      clearSession();
      showToast("Your session expired — please log in again.");
    }
    const detail = data && data.detail ? (Array.isArray(data.detail) ? data.detail[0].msg : data.detail) : `Request failed (${resp.status})`;
    throw new Error(detail);
  }
  return data;
}

const posts = [];



const TIER1 = new Set(["underage", "threat", "nonconsensual"]);
const TIER2 = new Set(["solicit", "harass", "unsolicited"]);

function severityOf(reason) {
  if (TIER1.has(reason)) return 1;
  if (TIER2.has(reason)) return 2;
  return 3;
}

let reportSeq = 4;
const reports = [
  {
    id: "R-0001", reason: "underage", detail: "Profile bio mentions being 16.",
    reportedHandle: "QuietFalcon42", reportedPostCode: "0091", createdAt: "2026-07-22 09:14",
    status: "open", priorReportsAgainst: 0, priorReportsByReporter: 1,
  },
  {
    id: "R-0002", reason: "harass", detail: "Kept messaging after I said I wasn't interested.",
    reportedHandle: "IronOtter88", reportedPostCode: "0077", createdAt: "2026-07-22 11:30",
    status: "open", priorReportsAgainst: 1, priorReportsByReporter: 3,
  },
  {
    id: "R-0003", reason: "scam", detail: "Asked me to pay a deposit off-platform before meeting.",
    reportedHandle: "SilverEcho19", reportedPostCode: "0064", createdAt: "2026-07-21 20:05",
    status: "open", priorReportsAgainst: 2, priorReportsByReporter: 1,
  },
];
const auditLog = [];

// ---------- Helpers ----------
function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  if (state.screen === "landing") root.appendChild(LandingScreen());
  if (state.screen === "gate") root.appendChild(GateScreen());
  if (state.screen === "signup") root.appendChild(SignupScreen());
  if (state.screen === "otp") root.appendChild(OtpScreen());
  if (state.screen === "login") root.appendChild(LoginScreen());
  if (state.screen === "feed") root.appendChild(FeedScreen());
  if (state.screen === "messages") root.appendChild(MessagesScreen());
  if (state.screen === "thread") root.appendChild(ThreadScreen());
  if (state.screen === "mod") root.appendChild(state.adminAuthenticated ? ModScreen() : AdminLoginScreen());
  if (state.screen === "adminLogin") root.appendChild(AdminLoginScreen());
  if (state.viewerMedia) root.appendChild(MediaViewer());
  if (state.reportModalOpen) root.appendChild(ReportModal());
  if (state.composeModalOpen) root.appendChild(ComposeModal());
  if (state.attachModalOpen) root.appendChild(AttachMediaModal());
  if (state.profileMenuOpen) root.appendChild(ProfileMenu());
  if (state.toast) root.appendChild(Toast());
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

function showToast(text) {
  state.toast = text;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}

// ---------- Screens ----------
function LandingScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:28px 20px; width:100%; display:flex; flex-direction:column; gap:16px; text-align:center;" });

  panel.appendChild(el("span", { class: "wordmark", style: "font-size:20px;" }, "Welcome to LiberChat"));
  panel.appendChild(el("p", { style: "font-size:14px; color:#8C8A82; line-height:1.5;" },
    "Speak freely. Meet safely."));

  const signupBtn = el("button", { class: "btn-primary" }, "Sign up");
  signupBtn.addEventListener("click", () => { state.screen = "gate"; render(); });

  const loginBtn = el("button", { class: "btn-secondary" }, "Log in");
  loginBtn.addEventListener("click", () => { state.screen = "login"; render(); });

  panel.appendChild(signupBtn);
  panel.appendChild(loginBtn);

  wrap.appendChild(panel);
  return wrap;
}

function GateScreen() {
  const points = [
    "You must be 18 or older to use LiberChat. Misrepresenting your age is a permanent ban.",
    "Identities are not verified beyond a phone number. Treat every stranger as unverified.",
    "Never allowed, no exceptions: any sexual content involving minors, threats of violence, or non-consensual media. These are reported to law enforcement.",
    "Not allowed: harassment, hate speech, doxxing, impersonation, solicitation of commercial sex, spam, or scams.",
    "Meeting in person is your decision and your risk. Meet public first, tell a friend where you're going.",
    "Report anything uncomfortable in two taps, from any post or message. Safety reports are reviewed first, before anything else in the queue.",
    "We do not tell a reported user who reported them.",
    "Phone verification is required at signup — this is what lets us block repeat abuse and keep the platform accountable.",
  ];

  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:8px;" });
  panel.appendChild(el("span", { class: "label" }, "Community guidelines — read before continuing"));

  points.forEach((text, i) => {
    const row = el("div", { class: "interstitial-point" }, [
      el("span", { class: "point-code" }, String(i + 1).padStart(2, "0")),
      el("span", { class: "point-text" }, text),
    ]);
    panel.appendChild(row);
  });

  const checkboxRow = el("label", { class: "checkbox-row", style: "cursor:pointer;" });
  const checkbox = el("input", { type: "checkbox" });
  checkbox.checked = state.gateChecked;
  checkbox.addEventListener("change", (e) => { state.gateChecked = e.target.checked; render(); });
  checkboxRow.appendChild(checkbox);
  checkboxRow.appendChild(el("span", {}, "I confirm I am 18 or older and agree to the Community Guidelines."));
  panel.appendChild(checkboxRow);

  const btn = el("button", { class: "btn-primary", style: "margin-top:16px;" }, "Continue");
  if (!state.gateChecked) btn.setAttribute("disabled", "true");
  btn.addEventListener("click", () => { if (state.gateChecked) { state.screen = "signup"; render(); } });
  panel.appendChild(btn);

  const backLink = el("button", { class: "btn-ghost", style: "margin-top:8px;" }, "← Back");
  backLink.addEventListener("click", () => { state.screen = "landing"; render(); });
  panel.appendChild(backLink);


  wrap.appendChild(panel);
  return wrap;
}

function saveSession(token) {
  state.authToken = token;
  localStorage.setItem("liberchat_auth_token", token);
}

function clearSession() {
  state.authToken = null;
  localStorage.removeItem("liberchat_auth_token");
  state.screen = "gate";
  render();
}
function field(type, placeholder, extra = {}) {
  const input = el("input", { type, placeholder, ...extra });
  input.style.cssText = "font-family:'Inter'; font-size:16px; padding:12px 16px; min-height:44px; border:1px solid #C9C7BC; background:#fff; width:100%;";
  return input;
}

function SignupScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Create account"));

  const phone = field("tel", "Phone number, e.g. +255700000000");
  const handle = field("text", "Handle — how others see you");
  const dob = field("date", "Date of birth");
  const password = field("password", "Password (12+ characters)");
  [phone, handle, dob, password].forEach((f) => panel.appendChild(f));

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Send verification code");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    submit.textContent = "Sending...";
    submit.disabled = true;
    try {
      await api("/auth/signup/start", {
        method: "POST",
        body: {
          phone_number: phone.value.trim(),
          dob: dob.value,
          age_gate_accepted: true,
          handle: handle.value.trim(),
          password: password.value,
        },
      });
      state.pendingSignup = { phoneNumber: phone.value.trim() };
      state.screen = "otp";
      render();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
      submit.textContent = "Send verification code";
      submit.disabled = false;
    }
  });
  panel.appendChild(submit);

  const backLink = el("button", { class: "btn-ghost", style: "margin-top:8px;" }, "← Back");
  backLink.addEventListener("click", () => { state.screen = "gate"; render(); });
  panel.appendChild(backLink);

  wrap.appendChild(panel);
  return wrap;
}

function OtpScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Enter verification code"));
  panel.appendChild(el("p", { style: "font-size:13px; color:#8C8A82;" },
    `A code was sent to ${state.pendingSignup.phoneNumber}.`));

  const code = field("text", "6-digit code");
  panel.appendChild(code);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Verify");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    try {
      const resp = await api("/auth/signup/verify", {
        method: "POST",
        body: { phone_number: state.pendingSignup.phoneNumber, otp_code: code.value.trim() },
      });
      saveSession(resp.access_token);
      state.pendingSignup = null;
      state.screen = "feed";
      render();
      loadFeed();
      loadThreads();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
    }
  });
  panel.appendChild(submit);

  wrap.appendChild(panel);
  return wrap;
}

function LoginScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:20px; width:100%; display:flex; flex-direction:column; gap:10px;" });
  panel.appendChild(el("span", { class: "label" }, "Log in"));

  const phone = field("tel", "Phone number");
  const password = field("password", "Password");
  panel.appendChild(phone);
  panel.appendChild(password);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "");
  panel.appendChild(errorMsg);

  const submit = el("button", { class: "btn-primary" }, "Log in");
  submit.addEventListener("click", async () => {
    errorMsg.style.display = "none";
    try {
      const resp = await api("/auth/login", {
        method: "POST",
        body: { phone_number: phone.value.trim(), password: password.value },
      });
      saveSession(resp.access_token);
      state.screen = "feed";
      render();
      loadFeed();
      loadThreads();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
    }
  });
  panel.appendChild(submit);

  const backLink = el("button", { class: "btn-ghost", style: "margin-top:8px;" }, "← Back");
  backLink.addEventListener("click", () => { state.screen = "landing"; render(); });
  panel.appendChild(backLink);

  wrap.appendChild(panel);
  return wrap;
}
async function loadFeed() {
  state.feedLoading = true;
  render();
  try {
    const data = await api("/posts/feed", { token: state.authToken });
    posts.length = 0; // clear mock seed data, replace with real posts
    data.forEach((p) => {
      posts.push({
        id: p.id,
        code: p.id.slice(0, 8).toUpperCase(),
        body: p.body_text,
        location: p.location_label || "NO LOCATION SET",
        tags: p.intent_tags && p.intent_tags.length ? p.intent_tags : ["OTHER"],
      });
    });
  } catch (e) {
    showToast("Could not load feed: " + e.message);
  } finally {
    state.feedLoading = false;
    render();
  }
}

function decodeJwtSub(token) {
  try {
    const payload = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return payload.sub;
  } catch (_) { return null; }
}

let activeSocket = null;

function mapMessage(m, isFromEvent) {
  const senderId = isFromEvent ? m.sender_id : m.sender_id;
  const createdAt = isFromEvent ? m.created_at : m.created_at;
  return {
    id: isFromEvent ? m.message_id : m.id,
    from: senderId === decodeJwtSub(state.authToken) ? "me" : "them",
    text: m.ciphertext,
    time: new Date(createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
    media: m.media_id ? {
      id: m.media_id,
      type: m.media_info?.type || "image",
      nsfw: m.media_info?.nsfw || false,
      nsfwAcknowledged: !(m.media_info?.nsfw),
      consumed: m.media_info?.consumed || false,
      viewCount: 0,
    } : null,
  };
}

function connectThreadSocket(threadId) {
  if (activeSocket) activeSocket.close();
  activeSocket = new WebSocket(`${API_BASE.replace("http", "ws")}/dm/ws/${threadId}?token=${state.authToken}`);
  activeSocket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    state.activeThread.messages.push(mapMessage(data, true));
    render();
  };
}

async function ensureSocketOpen(threadId) {
  if (activeSocket && activeSocket.readyState === WebSocket.OPEN) return true;
  // Render's free tier (and mobile browsers backgrounding a tab) can
  // silently drop an idle websocket. Reconnect once before giving up,
  // rather than immediately failing with "connection lost".
  connectThreadSocket(threadId);
  const start = Date.now();
  while (activeSocket.readyState !== WebSocket.OPEN) {
    if (Date.now() - start > 4000) return false;
    await new Promise((r) => setTimeout(r, 100));
  }
  return true;
}

async function openThread(postId) {
  try {
    const thread = await api("/dm/thread/start", { method: "POST", token: state.authToken, body: { post_id: postId } });
    const history = await api(`/dm/thread/${thread.id}/messages`, { token: state.authToken });

    state.activeThread = {
      id: thread.id,
      otherUserId: thread.user_a_id === decodeJwtSub(state.authToken) ? thread.user_b_id : thread.user_a_id,
      reported: false,
      messages: history.map((m) => mapMessage(m, false)),
    };
    connectThreadSocket(thread.id);
    state.screenBeforeThread = "feed";
    state.screen = "thread";
    render();
  } catch (e) {
    if (e.message && e.message.includes("own post")) {
      showToast("This is your own post — check Messages for responses.");
      state.screen = "messages";
      loadThreads();
      render();
      return;
    }
    showToast("Could not open thread: " + e.message);
  }
}

async function openExistingThread(threadId) {
  try {
    const thread = await api(`/dm/thread/${threadId}`, { token: state.authToken });
    const history = await api(`/dm/thread/${threadId}/messages`, { token: state.authToken });

    state.activeThread = {
      id: thread.id,
      otherUserId: thread.user_a_id === decodeJwtSub(state.authToken) ? thread.user_b_id : thread.user_a_id,
      reported: false,
      messages: history.map((m) => mapMessage(m, false)),
    };
    connectThreadSocket(thread.id);
    state.screenBeforeThread = "messages";
    state.screen = "thread";
    render();
  } catch (e) {
    showToast("Could not open thread: " + e.message);
  }
}

async function loadThreads() {
  state.threadsLoading = true;
  render();
  try {
    const data = await api("/dm/threads", { token: state.authToken });
    state.threads = data;
    state.unreadCount = data.filter((t) => t.unread).length;
  } catch (e) {
    showToast("Could not load messages: " + e.message);
  } finally {
    state.threadsLoading = false;
    render();
  }
}

function FeedScreen() {
  const wrap = el("div", { style: "display:flex; flex-direction:column; flex:1; min-height:0;" });
  wrap.appendChild(Header("feed"));

  const main = el("main", { class: "feed-main" });

  if (state.feedLoading && posts.length === 0) {
    main.appendChild(el("div", { class: "empty" }, "Loading feed..."));
  } else if (!state.feedLoading && posts.length === 0) {
    main.appendChild(el("div", { class: "empty" }, "No posts yet. Be the first — tap New Post."));
  }

  posts.forEach((p) => {
    const card = el("div", { class: "post panel", style: "cursor:pointer;" });
    card.addEventListener("click", () => openThread(p.id));

    card.appendChild(el("div", { class: "post-top" }, [
      el("span", { class: "label" }, `POST / ${p.code}`),
      el("span", { class: "label" }, p.location),
    ]));

    card.appendChild(el("p", { class: "post-body" }, p.body));

    const bottom = el("div", { class: "post-bottom" });
    bottom.appendChild(el("div", { class: "tags" }, p.tags.map((t) =>
      el("span", { class: t === "NSFW" ? "tag" : "tag", style: t === "NSFW" ? "border-color:#B23B2E; color:#B23B2E;" : "" }, t)
    )));

    respondBtn.addEventListener("click", (e) => { e.stopPropagation(); openThread(p.id); });
    bottom.appendChild(respondBtn);
    card.appendChild(bottom);

    main.appendChild(card);
  });
  wrap.appendChild(main);
  return wrap;
}



function Header(context, opts = {}) {
  const h = el("header", {});

  if (context === "thread") {
    const back = el("button", { class: "btn-ghost" }, "← Back");
    back.addEventListener("click", opts.onBack);
    h.appendChild(back);
    h.appendChild(el("span", { class: "label" }, opts.title || ""));
    const reportBtn = el("button", { class: "btn-danger" }, "Report");
    reportBtn.addEventListener("click", () => { state.reportModalOpen = true; render(); });
    h.appendChild(reportBtn);
    return h;
  }

  if (context === "messages") {
    const back = el("button", { class: "btn-ghost" }, "← Back");
    back.addEventListener("click", () => { state.screen = "feed"; render(); });
    h.appendChild(back);
    h.appendChild(el("span", { class: "label" }, "Messages"));
    h.appendChild(el("span", { style: "width:60px;" })); // balance the row
    return h;
  }

  // context === "feed"
  h.appendChild(el("span", { class: "wordmark" }, "Liberchat"));

  const right = el("div", { style: "display:flex; gap:8px; align-items:center;" });

  const newPostBtn = el("button", { class: "btn-secondary" }, "New post");
  newPostBtn.addEventListener("click", () => { state.composeModalOpen = true; render(); });
  right.appendChild(newPostBtn);

  const messagesBtn = el("button", { class: "btn-secondary", style: "position:relative;" },
    state.unreadCount > 0 ? `Messages (${state.unreadCount})` : "Messages");
  messagesBtn.addEventListener("click", () => { state.screen = "messages"; render(); loadThreads(); });
  right.appendChild(messagesBtn);

  const menuBtn = el("button", { class: "btn-ghost" }, "☰");
  menuBtn.addEventListener("click", () => { state.profileMenuOpen = true; render(); });
  right.appendChild(menuBtn);

  h.appendChild(right);
  return h;
}

  // Handle isn't in the JWT payload currently (only user id) - this is a

function ThreadScreen() {
  const thread = state.activeThread;
  const wrap = el("div", { style: "display:flex; flex-direction:column; flex:1; min-height:0;" });
  wrap.appendChild(Header("thread", {
    title: `THREAD / ${thread.id.slice(0, 8).toUpperCase()}`,
    onBack: () => { state.screen = state.screenBeforeThread; render(); },
  }));

  const msgsWrap = el("div", { class: "thread-msgs" });

  if (thread.reported) {
    msgsWrap.appendChild(el("div", { class: "empty" }, "This thread has been reported. It's frozen for review — the other person can't send new messages."));
  }

  if (thread.messages.length === 0) {
    msgsWrap.appendChild(el("div", { class: "empty" }, "No messages yet. Say hello."));
  }

  thread.messages.forEach((m) => {
    const bubble = el("div", { class: `msg ${m.from}` });
    if (m.text) bubble.appendChild(document.createTextNode(m.text));
    if (m.media) {
      let chip;
      if (m.media.consumed) {
        chip = el("div", { class: "media-chip consumed" },
          `${m.media.type.toUpperCase()} — VIEWED ${m.media.viewCount || 1}× — DELETED`);
      } else if (m.media.nsfw && !m.media.nsfwAcknowledged) {
        chip = el("div", {
          class: "media-chip",
          style: "border-color:#B23B2E; color:#B23B2E; background:repeating-linear-gradient(45deg,#F7F6F2,#F7F6F2 6px,#EDECE7 6px,#EDECE7 12px);",
        }, `⚠ NSFW ${m.media.type.toUpperCase()} — TAP TO REVEAL`);
        chip.addEventListener("click", () => { m.media.nsfwAcknowledged = true; render(); });
      } else {
        chip = el("div", { class: "media-chip" }, `TAP TO VIEW ${m.media.type.toUpperCase()} — VIEW ONCE`);
        chip.addEventListener("click", async () => {
          try {
            const resp = await api(`/media/${m.media.id}/view`, { method: "POST", token: state.authToken });
            m.media.viewCount = resp.view_count;
            state.viewerMedia = m.media;
            state.viewerSignedUrl = resp.signed_url;
            render();
          } catch (e) {
            showToast("Could not open media: " + e.message);
          }
        });
      }
      bubble.appendChild(document.createElement("br"));
      bubble.appendChild(chip);
    }
    bubble.appendChild(el("span", { class: "msg-meta" }, m.time));
    msgsWrap.appendChild(bubble);
  });

  wrap.appendChild(msgsWrap);

  const composer = el("div", { class: "composer" });
  const input = el("input", { type: "text", placeholder: thread.reported ? "This thread is frozen." : "Message — plaintext for now, E2EE key exchange not yet wired client-side" });
  if (thread.reported) input.setAttribute("disabled", "true");

  async function sendTextMessage() {
    if (thread.reported) return;
    if (!input.value.trim()) return;
    const ok = await ensureSocketOpen(thread.id);
    if (!ok) {
      showToast("Couldn't reconnect — check your connection and try again.");
      return;
    }
    activeSocket.send(JSON.stringify({ ciphertext: input.value.trim(), media_id: null }));
    // Optimistic local echo — the real row comes back for the recipient
    // via their own socket message; our own copy is added here since the
    // relay only pushes to the *other* participant, not an echo to sender.
    thread.messages.push({ from: "me", text: input.value.trim(), time: nowTime() });
    input.value = "";
    render();
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendTextMessage(); }
  });

  const mediaBtn = el("button", { class: "icon-btn" }, "＋");
  mediaBtn.addEventListener("click", () => {
    if (thread.reported) return;
    state.attachModalOpen = true;
    render();
  });
  const sendBtn = el("button", { class: "btn-secondary" }, "Send");
  sendBtn.addEventListener("click", sendTextMessage);

  // Input first, then attach, then send - keeps the primary text field
  // widest and puts the attach action between typing and sending rather
  // than leading the row.
  composer.appendChild(input);
  composer.appendChild(mediaBtn);
  composer.appendChild(sendBtn);
  wrap.appendChild(composer);

  return wrap;
}

function AdminLoginScreen() {
  const wrap = el("div", { style: "flex:1; display:flex; align-items:center; padding:24px;" });
  const panel = el("div", { class: "panel", style: "padding:24px; width:100%; display:flex; flex-direction:column; gap:14px;" });

  panel.appendChild(el("span", { class: "label" }, "Admin access"));
  panel.appendChild(el("p", { style: "font-size:13px; color:#8C8A82; line-height:1.5;" },
    "This is a separate login from regular LiberChat accounts. Admin credentials are issued out-of-band and are never created through the app."));

  const userInput = el("input", { type: "text", placeholder: "Admin username", autocomplete: "off" });
  userInput.style.cssText = "font-family:'IBM Plex Mono',monospace; font-size:16px; padding:12px 16px; min-height:44px; border:1px solid #C9C7BC; background:#fff;";
  const passInput = el("input", { type: "password", placeholder: "Password" });
  passInput.style.cssText = "font-family:'Inter'; font-size:16px; padding:12px 16px; min-height:44px; border:1px solid #C9C7BC; background:#fff;";

  panel.appendChild(userInput);
  panel.appendChild(passInput);

  if (state.adminLoginError) {
    panel.appendChild(el("span", { class: "label", style: "color:#B23B2E;" }, state.adminLoginError));
  }

  const submit = el("button", { class: "btn-primary" }, "Sign in");
  submit.addEventListener("click", () => {
    // In the real app this calls POST /admin/login against the separate
    // admin_users table and receives a token typed "admin" — a regular
    // user's token/credentials can never satisfy this, in either direction.
    if (userInput.value === MOCK_ADMIN_CREDENTIALS.username && passInput.value === MOCK_ADMIN_CREDENTIALS.password) {
      state.adminAuthenticated = true;
      state.adminLoginError = null;
      state.screen = "mod";
      render();
    } else {
      state.adminLoginError = "Invalid credentials.";
      render();
    }
  });
  panel.appendChild(submit);

  wrap.appendChild(panel);
  return wrap;
}

function ModScreen() {
  const wrap = el("div", { style: "display:flex; flex-direction:column; flex:1; min-height:0;" });

  const header = el("header", {});
  const back = el("button", { class: "btn-ghost" }, "← Sign out");
  back.addEventListener("click", () => {
    state.adminAuthenticated = false;
    state.screen = "feed";
    state.modSelectedReportId = null;
    render();
  });
  header.appendChild(back);
  header.appendChild(el("span", { class: "label" }, "MOD CONSOLE"));
  wrap.appendChild(header);

  const tabs = el("div", { style: "display:flex; border-bottom:1px solid #C9C7BC;" });
  ["queue", "audit"].forEach((tab) => {
    const t = el("button", {
      style: `flex:1; padding:12px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; border-bottom:2px solid ${state.modTab === tab ? "#FF4B1F" : "transparent"}; color:${state.modTab === tab ? "#141414" : "#8C8A82"};`,
    }, tab === "queue" ? `Queue (${reports.filter(r=>r.status==="open").length})` : `Audit log (${auditLog.length})`);
    t.addEventListener("click", () => { state.modTab = tab; state.modSelectedReportId = null; render(); });
    tabs.appendChild(t);
  });
  wrap.appendChild(tabs);

  const main = el("main", {});

  if (state.modTab === "queue") {
    const open = reports.filter((r) => r.status === "open").sort((a, b) => severityOf(a.reason) - severityOf(b.reason));
    if (open.length === 0) main.appendChild(el("div", { class: "empty" }, "Queue is empty."));
    open.forEach((r) => main.appendChild(state.modSelectedReportId === r.id ? CaseDetail(r) : QueueRow(r)));
  } else {
    if (auditLog.length === 0) main.appendChild(el("div", { class: "empty" }, "No resolved cases yet."));
    auditLog.slice().reverse().forEach((r) => main.appendChild(AuditRow(r)));
  }

  wrap.appendChild(main);
  return wrap;
}

function severityLabel(reason) {
  const s = severityOf(reason);
  if (s === 1) return { text: "TIER 1", color: "#B23B2E" };
  if (s === 2) return { text: "TIER 2", color: "#C97A00" };
  return { text: "TIER 3", color: "#8C8A82" };
}

function QueueRow(r) {
  const sev = severityLabel(r.reason);
  const row = el("div", { class: "panel", style: `padding:14px; margin-bottom:10px; border-left:3px solid ${sev.color}; cursor:pointer;` });
  row.addEventListener("click", () => { state.modSelectedReportId = r.id; render(); });
  row.appendChild(el("div", { style: "display:flex; justify-content:space-between;" }, [
    el("span", { class: "label", style: `color:${sev.color};` }, `${sev.text} — ${r.reason.toUpperCase()}`),
    el("span", { class: "label" }, r.id),
  ]));
  row.appendChild(el("p", { style: "font-size:13px; margin-top:8px;" }, r.detail));
  row.appendChild(el("div", { style: "display:flex; justify-content:space-between; margin-top:8px;" }, [
    el("span", { class: "label" }, `@${r.reportedHandle} · POST/${r.reportedPostCode}`),
    el("span", { class: "label" }, r.createdAt),
  ]));
  return row;
}

function CaseDetail(r) {
  const sev = severityLabel(r.reason);
  const wrap = el("div", { class: "panel", style: `padding:16px; margin-bottom:10px; border-left:3px solid ${sev.color};` });

  wrap.appendChild(el("div", { style: "display:flex; justify-content:space-between;" }, [
    el("span", { class: "label", style: `color:${sev.color};` }, `${sev.text} — ${r.reason.toUpperCase()}`),
    el("span", { class: "label" }, r.id),
  ]));
  wrap.appendChild(el("p", { style: "font-size:14px; margin:10px 0; line-height:1.5;" }, r.detail));

  const meta = el("div", { class: "label", style: "display:flex; flex-direction:column; gap:4px; border-top:1px solid #C9C7BC; border-bottom:1px solid #C9C7BC; padding:10px 0; margin-bottom:10px;" });
  meta.appendChild(el("span", {}, `Reported user: @${r.reportedHandle}`));
  meta.appendChild(el("span", {}, `Source: POST/${r.reportedPostCode}`));
  meta.appendChild(el("span", {}, `Prior reports against this user: ${r.priorReportsAgainst}`));
  meta.appendChild(el("span", {}, `Prior reports filed by this reporter: ${r.priorReportsByReporter}`));
  wrap.appendChild(meta);

  const noteArea = document.createElement("textarea");
  noteArea.placeholder = "Required: note explaining your decision before this case can close.";
  noteArea.style.cssText = "font-family:'Inter'; font-size:14px; padding:10px; min-height:70px; border:1px solid #C9C7BC; background:#fff; width:100%; margin-bottom:10px;";
  wrap.appendChild(noteArea);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none; margin-bottom:8px;" }, "A note is required to close this case.");
  wrap.appendChild(errorMsg);

  const actions = [
    { key: "dismiss", label: "Dismiss" },
    { key: "remove_content", label: "Remove content" },
    { key: "remove_and_strike", label: "Remove + strike" },
    { key: "remove_and_ban", label: "Remove + ban" },
  ];
  if (sev.text === "TIER 1") {
    actions.push({ key: "remove_ban_and_report_ncmec", label: "Remove + ban + report to NCMEC", danger: true });
  }

  const actionGrid = el("div", { style: "display:flex; flex-direction:column; gap:8px;" });
  actions.forEach((a) => {
    const b = el("button", { class: a.danger ? "btn-danger" : "btn-secondary", style: "width:100%; text-align:center;" }, a.label);
    b.addEventListener("click", () => {
      if (!noteArea.value.trim()) { errorMsg.style.display = "block"; return; }
      r.status = "resolved";
      r.modAction = a.key;
      r.modNote = noteArea.value.trim();
      r.resolvedAt = new Date().toISOString().slice(0, 16).replace("T", " ");
      auditLog.push(r);
      state.modSelectedReportId = null;
      render();
      showToast(a.danger ? "Case closed — routed to NCMEC review" : "Case closed");
    });
    actionGrid.appendChild(b);
  });
  wrap.appendChild(actionGrid);

  const cancel = el("button", { class: "btn-ghost", style: "margin-top:8px;" }, "Close without deciding");
  cancel.addEventListener("click", () => { state.modSelectedReportId = null; render(); });
  wrap.appendChild(cancel);

  return wrap;
}

function AuditRow(r) {
  const row = el("div", { class: "panel", style: "padding:14px; margin-bottom:10px;" });
  row.appendChild(el("div", { style: "display:flex; justify-content:space-between;" }, [
    el("span", { class: "label" }, r.id),
    el("span", { class: "label" }, r.resolvedAt),
  ]));
  row.appendChild(el("p", { style: "font-size:13px; margin-top:8px;" }, `Action: ${r.modAction.replace(/_/g, " ")}`));
  row.appendChild(el("p", { style: "font-size:13px; color:#8C8A82; margin-top:4px;" }, `Note: ${r.modNote}`));
  return row;
}

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
}

function MediaViewer() {
  const media = state.viewerMedia;
  const wrap = el("div", { class: "viewer" });
  wrap.appendChild(el("div", { class: "viewer-top" }, [
    el("span", { class: "label", style: "color:#888;" }, `${media.type.toUpperCase()} / VIEWED ${media.viewCount}×`),
    (() => {
      const b = el("button", { class: "btn-danger" }, "Close — deletes on exit");
      b.addEventListener("click", async () => {
        try {
          await api(`/media/${media.id}/end-session`, { method: "POST", token: state.authToken });
        } catch (e) {
          showToast("Warning: could not confirm deletion — " + e.message);
        }
        const msg = state.activeThread.messages.find((m) => m.media && m.media.id === media.id);
        if (msg) { msg.media.consumed = true; msg.media.viewCount = media.viewCount; }
        state.viewerMedia = null;
        state.viewerSignedUrl = null;
        render();
        showToast("Media deleted from server");
      });
      return b;
    })(),
  ]));

  const replay = el("button", { class: "btn-secondary", style: "margin:0 auto;" }, "Replay (within this session)");
  replay.addEventListener("click", async () => {
    try {
      const resp = await api(`/media/${media.id}/view`, { method: "POST", token: state.authToken });
      media.viewCount = resp.view_count;
      render();
    } catch (e) {
      showToast("Could not replay: " + e.message);
    }
  });

  const body = el("div", { class: "viewer-body" });
  if (media.type === "image") {
    body.appendChild(el("img", { src: state.viewerSignedUrl, style: "max-height:70vh; max-width:100%;" }));
  } else if (media.type === "video") {
    const v = document.createElement("video");
    v.src = state.viewerSignedUrl; v.controls = true; v.autoplay = true;
    v.style.cssText = "max-height:70vh; max-width:100%;";
    body.appendChild(v);
  } else {
    const a = document.createElement("audio");
    a.src = state.viewerSignedUrl; a.controls = true; a.autoplay = true;
    body.appendChild(a);
  }
  body.appendChild(el("div", { style: "margin-top:20px; text-align:center;" }, replay));
  wrap.appendChild(body);

  wrap.appendChild(el("div", { class: "viewer-bottom" }, el("span", { class: "label", style: "color:#666;" }, "This content deletes permanently when you leave this screen.")));
  return wrap;
}

function ReportModal() {
  const reasons = [
    { key: "underage", backendKey: "underage", label: "Underage or suspected minor", tier1: true },
    { key: "threat", backendKey: "threat_or_violence", label: "Threats or made me feel unsafe", tier1: true },
    { key: "nonconsensual", backendKey: "non_consensual", label: "Non-consensual media", tier1: true },
    { key: "solicit", backendKey: "solicitation", label: "Soliciting payment / prostitution" },
    { key: "harass", backendKey: "harassment", label: "Harassment or abusive language" },
    { key: "unsolicited", backendKey: "unsolicited_explicit_media", label: "Unsolicited explicit media" },
    { key: "scam", backendKey: "scam", label: "Scam or off-platform payment request" },
    { key: "other", backendKey: "other", label: "Other" },
  ];
  const backdrop = el("div", { class: "modal-backdrop" });
  const modal = el("div", { class: "modal" });
  modal.appendChild(el("span", { class: "label" }, "Report this thread"));
  reasons.forEach((r) => {
    const b = el("button", { class: r.tier1 ? "reason-btn tier1" : "reason-btn" }, r.label);
    b.addEventListener("click", async () => {
      try {
        await api("/reports/file", {
          method: "POST",
          token: state.authToken,
          body: {
            reported_user_id: state.activeThread.otherUserId,
            reason: r.backendKey,
            thread_id: state.activeThread.id,
          },
        });
        state.activeThread.reported = true;
        state.reportModalOpen = false;
        render();
        showToast(r.tier1 ? "Reported — priority review, sender restricted" : "Reported — thread frozen for review");
      } catch (e) {
        showToast("Could not file report: " + e.message);
      }
    });
    modal.appendChild(b);
  });
  const cancel = el("button", { class: "btn-ghost", style: "margin-top:6px;" }, "Cancel");
  cancel.addEventListener("click", () => { state.reportModalOpen = false; render(); });
  modal.appendChild(cancel);
  backdrop.appendChild(modal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.reportModalOpen = false; render(); } });
  return backdrop;
}

function AttachMediaModal() {
  const backdrop = el("div", { class: "modal-backdrop" });
  const modal = el("div", { class: "modal" });
  modal.appendChild(el("span", { class: "label" }, "Attach media — view once"));
  modal.appendChild(el("p", { style: "font-size:13px; color:var(--muted); line-height:1.5;" },
    "The recipient can view this once. It's permanently deleted the moment they leave the viewer."));

  let selectedType = "image";
  let selectedFile = null;   // either a picked File or a recorded Blob
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStartedAt = null;

  const typeRow = el("div", { style: "display:flex; gap:6px;" });
  const inputContainer = el("div", { style: "display:flex; flex-direction:column; gap:8px;" });

  function renderInputOptions() {
    inputContainer.innerHTML = "";
    selectedFile = null;

    if (selectedType === "image" || selectedType === "video") {
      // capture="environment" opens the device camera directly on mobile
      // browsers that support it; on desktop it just falls back to a
      // normal file picker, so this is safe cross-platform.
      const fileInput = el("input", {
        type: "file",
        accept: selectedType === "image" ? "image/*" : "video/*",
        capture: "environment",
      });
      fileInput.style.cssText = "font-size:13px;";
      fileInput.addEventListener("change", () => { selectedFile = fileInput.files[0] || null; });
      inputContainer.appendChild(fileInput);
      inputContainer.appendChild(el("span", { class: "label" }, "Tap to take a photo/video or choose from your device"));
    } else {
      // Audio: offer both a plain file picker AND in-browser recording.
      const fileInput = el("input", { type: "file", accept: "audio/*" });
      fileInput.style.cssText = "font-size:13px;";
      fileInput.addEventListener("change", () => { selectedFile = fileInput.files[0] || null; recordStatus.textContent = ""; });
      inputContainer.appendChild(fileInput);
      inputContainer.appendChild(el("span", { class: "label" }, "— or —"));

      const recordBtn = el("button", { class: "btn-secondary" }, "🎙 Record audio");
      const recordStatus = el("span", { class: "label", style: "color:var(--danger);" }, "");
      inputContainer.appendChild(recordBtn);
      inputContainer.appendChild(recordStatus);

      recordBtn.addEventListener("click", async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
              const blob = new Blob(recordedChunks, { type: "audio/webm" });
              selectedFile = new File([blob], "recording.webm", { type: "audio/webm" });
              stream.getTracks().forEach((t) => t.stop());
              recordBtn.textContent = "🎙 Record again";
              recordStatus.textContent = "Recorded — ready to send.";
            };
            mediaRecorder.start();
            recordingStartedAt = Date.now();
            recordBtn.textContent = "⏹ Stop recording";
            recordStatus.textContent = "Recording...";
          } catch (e) {
            recordStatus.textContent = "Microphone access denied or unavailable.";
          }
        } else {
          mediaRecorder.stop();
        }
      });
    }
  }

  ["image", "video", "audio"].forEach((type) => {
    const chip = el("button", {
      class: "tag",
      style: `cursor:pointer; padding:10px 14px; ${type === selectedType ? "background:var(--ink); color:var(--surface);" : ""}`,
    }, type.toUpperCase());
    chip.addEventListener("click", () => {
      selectedType = type;
      [...typeRow.children].forEach((c) => { c.style.background = "transparent"; c.style.color = "var(--muted)"; });
      chip.style.background = "var(--ink)";
      chip.style.color = "var(--surface)";
      renderInputOptions();
    });
    typeRow.appendChild(chip);
  });
  modal.appendChild(typeRow);
  modal.appendChild(inputContainer);
  renderInputOptions();

  let markedNsfw = false;
  const nsfwRow = el("label", { style: "display:flex; align-items:center; gap:10px; cursor:pointer; padding-top:6px;" });
  const nsfwCheckbox = el("input", { type: "checkbox" });
  nsfwCheckbox.addEventListener("change", (e) => { markedNsfw = e.target.checked; });
  nsfwRow.appendChild(nsfwCheckbox);
  nsfwRow.appendChild(el("span", { style: "font-size:13px; color:var(--danger);" }, "Tag this NSFW — recipient sees a warning before it reveals"));
  modal.appendChild(nsfwRow);

  const errorMsg = el("span", { class: "label", style: "color:var(--danger); display:none;" }, "");
  modal.appendChild(errorMsg);

  const sendBtn = el("button", { class: "btn-primary" }, "Send");
  sendBtn.addEventListener("click", async () => {
    if (!selectedFile) {
      errorMsg.textContent = "Choose or record a file first.";
      errorMsg.style.display = "block";
      return;
    }
    sendBtn.textContent = "Uploading...";
    sendBtn.disabled = true;
    try {
      const form = new FormData();
      form.append("file", selectedFile);
      form.append("media_type", selectedType);
      form.append("nsfw", markedNsfw ? "true" : "false");
      const uploadResp = await api("/media/upload", { method: "POST", token: state.authToken, body: form, isFormData: true });

      const ok = await ensureSocketOpen(state.activeThread.id);
      if (!ok) {
        errorMsg.textContent = "Uploaded, but couldn't reconnect to send it. Try again.";
        errorMsg.style.display = "block";
        sendBtn.textContent = "Send";
        sendBtn.disabled = false;
        return;
      }

      activeSocket.send(JSON.stringify({ ciphertext: null, media_id: uploadResp.media_id }));
      state.activeThread.messages.push({
        from: "me",
        time: nowTime(),
        media: { id: uploadResp.media_id, type: selectedType, nsfw: markedNsfw, nsfwAcknowledged: !markedNsfw, viewCount: 0 },
      });
      state.attachModalOpen = false;
      render();
      showToast("Media sent — recipient can view once");
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
      sendBtn.textContent = "Send";
      sendBtn.disabled = false;
    }
  });
  modal.appendChild(sendBtn);

  const cancel = el("button", { class: "btn-ghost" }, "Cancel");
  cancel.addEventListener("click", () => {
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    state.attachModalOpen = false;
    render();
  });
  modal.appendChild(cancel);

  backdrop.appendChild(modal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.attachModalOpen = false; render(); } });
  return backdrop;
}

function ComposeModal() {
  const backdrop = el("div", { class: "modal-backdrop" });
  const modal = el("div", { class: "modal" });
  modal.appendChild(el("span", { class: "label" }, "New post"));

  const textarea = document.createElement("textarea");
  textarea.placeholder = "What are you looking for? Be specific about intent — vague posts get fewer responses.";
  textarea.style.cssText = "font-family:'Inter'; font-size:16px; padding:12px 16px; min-height:100px; border:1px solid #C9C7BC; background:#fff; resize:vertical; width:100%;";
  modal.appendChild(textarea);

  const locationInput = el("input", { type: "text", placeholder: "Location — neighborhood only, e.g. STONE TOWN" });
  locationInput.style.cssText = "font-family:'IBM Plex Mono',monospace; font-size:16px; padding:12px 16px; border:1px solid #C9C7BC; background:#fff; width:100%; text-transform:uppercase;";
  modal.appendChild(locationInput);

  const availableTags = ["CASUAL", "FRIENDS", "ACTIVITY", "SERIOUS", "NSFW", "OTHER"];
  const selectedTags = new Set();
  const tagRow = el("div", { style: "display:flex; gap:6px; flex-wrap:wrap;" });
  availableTags.forEach((tag) => {
    const chip = el("button", { class: "tag", style: `cursor:pointer; padding:8px 10px; ${tag === "NSFW" ? "border-color:#B23B2E; color:#B23B2E;" : ""}` }, tag);
    chip.addEventListener("click", () => {
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        chip.style.background = "transparent";
        chip.style.color = tag === "NSFW" ? "#B23B2E" : "#8C8A82";
      } else {
        selectedTags.add(tag);
        chip.style.background = tag === "NSFW" ? "#B23B2E" : "#141414";
        chip.style.color = "#F7F6F2";
      }
    });
    tagRow.appendChild(chip);
  });
  modal.appendChild(tagRow);

  const errorMsg = el("span", { class: "label", style: "color:#B23B2E; display:none;" }, "Post text is required.");
  modal.appendChild(errorMsg);

  const submitBtn = el("button", { class: "btn-primary" }, "Post");
  submitBtn.addEventListener("click", async () => {
    if (!textarea.value.trim()) {
      errorMsg.style.display = "block";
      return;
    }
    const tags = selectedTags.size ? Array.from(selectedTags) : ["OTHER"];
    submitBtn.textContent = "Posting...";
    submitBtn.disabled = true;
    try {
      await api("/posts/", {
        method: "POST",
        token: state.authToken,
        body: {
          body_text: textarea.value.trim(),
          intent_tags: tags,
          location_label: locationInput.value.trim().toUpperCase() || null,
        },
      });
      state.composeModalOpen = false;
      render();
      showToast("Post published");
      loadFeed();
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.style.display = "block";
      submitBtn.textContent = "Post";
      submitBtn.disabled = false;
    }
  });
  modal.appendChild(submitBtn);

  const cancel = el("button", { class: "btn-ghost" }, "Cancel");
  cancel.addEventListener("click", () => { state.composeModalOpen = false; render(); });
  modal.appendChild(cancel);

  backdrop.appendChild(modal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.composeModalOpen = false; render(); } });
  return backdrop;
}

function Toast() {
  return el("div", { class: "toast" }, state.toast);
}

// Admin console is reachable ONLY via a direct URL (e.g. yourapp.com/#admin),
// never via any link, button, or nav item inside the regular app. A normal
// user browsing LiberChat has no path that leads here.
if (state.darkMode) document.body.classList.add("dark");

if (window.location.hash === "#admin") {
  state.screen = "adminLogin";
} else {
  const savedToken = localStorage.getItem("liberchat_auth_token");
  if (savedToken) {
    state.authToken = savedToken;
    state.screen = "feed";
    // Fire-and-forget: if the token's expired/invalid, loadFeed's own
    // error handling will show a toast. A 401 here doesn't auto-log-out
    // since a transient network hiccup shouldn't silently sign someone
    // out — they can still navigate normally and retry.
    loadFeed();
    loadThreads();
  }
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // Fails silently if served from file:// or a host that blocks SW —
      // app still works as a normal page, just not installable.
    });
  });
}
</script>
